<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استعادة كلمة المرور / Récupération</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #f3f4f6;
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    background: #fff;
    width: 100%;
    max-width: 420px;
    margin: 20px;
    border-radius: 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    padding: 30px 24px;
  }
  .lang-switch {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-bottom: 16px;
  }
  .lang-switch button {
    border: 1px solid #ddd;
    background: #fff;
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 13px;
    color: #555;
  }
  .lang-switch button.active {
    background: #2563eb;
    color: #fff;
    border-color: #2563eb;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 8px;
    text-align: center;
    color: #1f2937;
  }
  p.subtitle {
    text-align: center;
    color: #6b7280;
    font-size: 13px;
    margin: 0 0 20px;
  }
  label {
    display: block;
    font-size: 14px;
    margin-bottom: 6px;
    color: #374151;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 15px;
    margin-bottom: 16px;
    outline: none;
  }
  input:focus {
    border-color: #2563eb;
  }
  button.primary {
    width: 100%;
    padding: 13px;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
    font-weight: 600;
  }
  button.primary:disabled {
    background: #93c5fd;
    cursor: not-allowed;
  }
  button.primary:hover:not(:disabled) {
    background: #1d4ed8;
  }
  .msg {
    margin-top: 14px;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
    display: none;
  }
  .msg.success {
    background: #dcfce7;
    color: #166534;
    display: block;
  }
  .msg.error {
    background: #fee2e2;
    color: #991b1b;
    display: block;
  }
  .step {
    display: none;
  }
  .step.active {
    display: block;
  }
  .resend {
    text-align: center;
    margin-top: 12px;
    font-size: 13px;
    color: #6b7280;
  }
  .resend a {
    color: #2563eb;
    cursor: pointer;
    text-decoration: none;
  }
  .resend a.disabled {
    color: #9ca3af;
    pointer-events: none;
  }
  .success-icon {
    text-align: center;
    font-size: 48px;
    margin-bottom: 12px;
  }
  .login-link {
    text-align: center;
    margin-top: 16px;
    font-size: 13px;
    color: #6b7280;
  }
  .login-link a {
    color: #2563eb;
    text-decoration: none;
    font-weight: 600;
  }
  .hint {
    font-size: 12px;
    color: #9ca3af;
    margin-top: -12px;
    margin-bottom: 16px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="lang-switch">
    <button id="btn-ar" class="active" onclick="setLang('ar')">العربية</button>
    <button id="btn-fr" onclick="setLang('fr')">Français</button>
  </div>

  <h1 data-i18n="title">استعادة كلمة المرور</h1>
  <p class="subtitle" data-i18n="subtitle">أدخل رقم هاتفك المسجّل لإعادة تعيين كلمة المرور</p>

  <!-- الخطوة 1: إدخال رقم الهاتف -->
  <div id="step1" class="step active">
    <label data-i18n="phoneLabel">رقم الهاتف</label>
    <input type="tel" id="phoneInput" placeholder="0555 12 34 56" />
    <button class="primary" id="sendBtn" onclick="sendOtp()">
      <span data-i18n="sendBtn">إرسال رمز التحقق</span>
    </button>
    <div id="msg1" class="msg"></div>
  </div>

  <!-- الخطوة 2: إدخال رمز التحقق -->
  <div id="step2" class="step">
    <label data-i18n="otpLabel">رمز التحقق</label>
    <input type="text" id="otpInput" maxlength="6" placeholder="123456" />
    <button class="primary" id="verifyBtn" onclick="verifyOtp()">
      <span data-i18n="verifyBtn">تحقق</span>
    </button>
    <div class="resend">
      <span data-i18n="resendText">لم يصلك الرمز؟</span>
      <a id="resendLink" onclick="resendOtp()" data-i18n="resendLink">إعادة الإرسال</a>
      <span id="resendTimer"></span>
    </div>
    <div id="msg2" class="msg"></div>
  </div>

  <!-- الخطوة 3: كلمة المرور الجديدة -->
  <div id="step3" class="step">
    <label data-i18n="newPasswordLabel">كلمة المرور الجديدة</label>
    <input type="password" id="newPasswordInput" placeholder="••••••••" />
    <div class="hint" data-i18n="passwordHint">6 أحرف على الأقل</div>

    <label data-i18n="confirmPasswordLabel">تأكيد كلمة المرور</label>
    <input type="password" id="confirmPasswordInput" placeholder="••••••••" />

    <button class="primary" id="resetBtn" onclick="resetPassword()">
      <span data-i18n="resetBtn">تغيير كلمة المرور</span>
    </button>
    <div id="msg3" class="msg"></div>
  </div>

  <!-- الخطوة 4: نجاح -->
  <div id="step4" class="step">
    <div class="success-icon">✅</div>
    <h1 data-i18n="doneTitle">تم تغيير كلمة المرور بنجاح</h1>
    <div class="login-link">
      <a href="login.html" data-i18n="goToLogin">اذهب لتسجيل الدخول</a>
    </div>
  </div>
</div>

<script>
  const API_BASE = window.location.origin;
  const PURPOSE = 'reset_password';

  let currentLang = 'ar';
  let currentPhone = '';
  let currentOtp = '';
  let resendCooldown = 0;
  let resendInterval = null;

  const translations = {
    ar: {
      title: 'استعادة كلمة المرور',
      subtitle: 'أدخل رقم هاتفك المسجّل لإعادة تعيين كلمة المرور',
      phoneLabel: 'رقم الهاتف',
      sendBtn: 'إرسال رمز التحقق',
      otpLabel: 'رمز التحقق',
      verifyBtn: 'تحقق',
      resendText: 'لم يصلك الرمز؟',
      resendLink: 'إعادة الإرسال',
      newPasswordLabel: 'كلمة المرور الجديدة',
      passwordHint: '6 أحرف على الأقل',
      confirmPasswordLabel: 'تأكيد كلمة المرور',
      resetBtn: 'تغيير كلمة المرور',
      doneTitle: 'تم تغيير كلمة المرور بنجاح',
      goToLogin: 'اذهب لتسجيل الدخول',
      sending: 'جارٍ الإرسال...',
      verifying: 'جارٍ التحقق...',
      resetting: 'جارٍ التغيير...',
      otpSent: 'تم إرسال رمز التحقق إلى هاتفك',
      otpVerified: 'تم التحقق بنجاح!',
      errPhone: 'الرجاء إدخال رقم هاتف صحيح',
      errOtp: 'الرجاء إدخال رمز التحقق المكوّن من 6 أرقام',
      errPassword: 'كلمة المرور يجب أن تكون 6 أحرف على الأقل',
      errConfirmPassword: 'كلمتا المرور غير متطابقتين',
      resendWait: 'يمكنك إعادة الإرسال بعد'
    },
    fr: {
      title: 'Récupération du mot de passe',
      subtitle: 'Entrez votre numéro pour réinitialiser votre mot de passe',
      phoneLabel: 'Numéro de téléphone',
      sendBtn: 'Envoyer le code',
      otpLabel: 'Code de vérification',
      verifyBtn: 'Vérifier',
      resendText: "Vous n'avez pas reçu le code ?",
      resendLink: 'Renvoyer',
      newPasswordLabel: 'Nouveau mot de passe',
      passwordHint: '6 caractères minimum',
      confirmPasswordLabel: 'Confirmer le mot de passe',
      resetBtn: 'Changer le mot de passe',
      doneTitle: 'Mot de passe changé avec succès',
      goToLogin: 'Aller à la connexion',
      sending: 'Envoi en cours...',
      verifying: 'Vérification en cours...',
      resetting: 'Changement en cours...',
      otpSent: 'Le code a été envoyé à votre téléphone',
      otpVerified: 'Vérifié avec succès !',
      errPhone: 'Veuillez entrer un numéro de téléphone valide',
      errOtp: 'Veuillez entrer le code à 6 chiffres',
      errPassword: 'Le mot de passe doit contenir au moins 6 caractères',
      errConfirmPassword: 'Les mots de passe ne correspondent pas',
      resendWait: 'Vous pourrez renvoyer le code dans'
    }
  };

  function setLang(lang) {
    currentLang = lang;
    document.getElementById('btn-ar').classList.toggle('active', lang === 'ar');
    document.getElementById('btn-fr').classList.toggle('active', lang === 'fr');
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (translations[lang][key]) {
        el.textContent = translations[lang][key];
      }
    });
  }

  function t(key) {
    return translations[currentLang][key];
  }

  function showMsg(elId, text, type) {
    const el = document.getElementById(elId);
    el.textContent = text;
    el.className = 'msg ' + type;
  }

  function normalizePhone(raw) {
    let p = raw.replace(/\s|-/g, '');
    if (p.startsWith('0')) {
      p = '213' + p.substring(1);
    }
    p = p.replace('+', '');
    return p;
  }

  async function sendOtp() {
    const raw = document.getElementById('phoneInput').value.trim();
    if (!raw || raw.length < 8) {
      showMsg('msg1', t('errPhone'), 'error');
      return;
    }

    currentPhone = normalizePhone(raw);
    const btn = document.getElementById('sendBtn');
    btn.disabled = true;
    btn.textContent = t('sending');

    try {
      const res = await fetch(`${API_BASE}/api/send-otp`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: currentPhone, purpose: PURPOSE })
      });
      const data = await res.json();

      if (data.success) {
        showMsg('msg1', t('otpSent'), 'success');
        setTimeout(() => {
          document.getElementById('step1').classList.remove('active');
          document.getElementById('step2').classList.add('active');
          startResendCooldown();
        }, 800);
      } else {
        showMsg('msg1', data.error || 'Error', 'error');
      }
    } catch (err) {
      showMsg('msg1', 'Network error: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = `<span data-i18n="sendBtn">${t('sendBtn')}</span>`;
    }
  }

  async function verifyOtp() {
    const code = document.getElementById('otpInput').value.trim();
    if (!code || code.length !== 6) {
      showMsg('msg2', t('errOtp'), 'error');
      return;
    }

    const btn = document.getElementById('verifyBtn');
    btn.disabled = true;
    btn.textContent = t('verifying');

    // نتحقق فقط من صحة الرمز شكلياً هنا؛ التحقق الفعلي والاستهلاك يتم عبر /api/reset-password
    // نخزن الرمز لاستخدامه في الخطوة التالية دون استهلاكه هنا
    currentOtp = code;
    showMsg('msg2', t('otpVerified'), 'success');
    setTimeout(() => {
      document.getElementById('step2').classList.remove('active');
      document.getElementById('step3').classList.add('active');
    }, 600);

    btn.disabled = false;
    btn.innerHTML = `<span data-i18n="verifyBtn">${t('verifyBtn')}</span>`;
  }

  async function resetPassword() {
    const newPassword = document.getElementById('newPasswordInput').value;
    const confirmPassword = document.getElementById('confirmPasswordInput').value;

    if (!newPassword || newPassword.length < 6) {
      showMsg('msg3', t('errPassword'), 'error');
      return;
    }
    if (newPassword !== confirmPassword) {
      showMsg('msg3', t('errConfirmPassword'), 'error');
      return;
    }

    const btn = document.getElementById('resetBtn');
    btn.disabled = true;
    btn.textContent = t('resetting');

    try {
      const res = await fetch(`${API_BASE}/api/reset-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: currentPhone, otp_code: currentOtp, new_password: newPassword })
      });
      const data = await res.json();

      if (data.success) {
        document.getElementById('step3').classList.remove('active');
        document.getElementById('step4').classList.add('active');
      } else {
        showMsg('msg3', data.error || 'Error', 'error');
      }
    } catch (err) {
      showMsg('msg3', 'Network error: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = `<span data-i18n="resetBtn">${t('resetBtn')}</span>`;
    }
  }

  function startResendCooldown() {
    resendCooldown = 60;
    const link = document.getElementById('resendLink');
    const timer = document.getElementById('resendTimer');
    link.classList.add('disabled');

    resendInterval = setInterval(() => {
      resendCooldown--;
      timer.textContent = ` (${t('resendWait')} ${resendCooldown}s)`;
      if (resendCooldown <= 0) {
        clearInterval(resendInterval);
        link.classList.remove('disabled');
        timer.textContent = '';
      }
    }, 1000);
  }

  async function resendOtp() {
    if (resendCooldown > 0) return;

    try {
      const res = await fetch(`${API_BASE}/api/send-otp`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: currentPhone, purpose: PURPOSE })
      });
      const data = await res.json();

      if (data.success) {
        showMsg('msg2', t('otpSent'), 'success');
        startResendCooldown();
      } else {
        showMsg('msg2', data.error || 'Error', 'error');
      }
    } catch (err) {
      showMsg('msg2', 'Network error: ' + err.message, 'error');
    }
  }

  setLang('ar');
</script>

</body>
</html>
