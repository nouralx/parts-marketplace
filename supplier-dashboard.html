<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة المورّد</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #f3f4f6;
    margin: 0;
    padding: 0;
    color: #1f2937;
  }
  /* ===== شاشة الدخول ===== */
  .login-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .login-card {
    background: #fff;
    width: 100%;
    max-width: 400px;
    margin: 20px;
    border-radius: 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    padding: 30px 24px;
  }
  .login-card h1 {
    font-size: 19px;
    text-align: center;
    margin: 0 0 24px;
  }
  label {
    display: block;
    font-size: 13px;
    margin-bottom: 6px;
    color: #6b7280;
  }
  input, select, textarea {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 14px;
    margin-bottom: 14px;
    outline: none;
    font-family: inherit;
  }
  input:focus, select:focus, textarea:focus {
    border-color: #2563eb;
  }
  button.primary {
    width: 100%;
    padding: 12px;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
    font-weight: 600;
  }
  button.primary:disabled { background: #93c5fd; cursor: not-allowed; }
  .msg {
    margin-top: 12px;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    display: none;
  }
  .msg.error { background: #fee2e2; color: #991b1b; display: block; }
  .msg.success { background: #dcfce7; color: #166534; display: block; }

  /* ===== لوحة التحكم ===== */
  #dashboardScreen { display: none; }
  header {
    background: #fff;
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #e5e7eb;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header .title { font-size: 15px; font-weight: 700; }
  header .sub { font-size: 11px; color: #9ca3af; }
  header button {
    background: #f3f4f6;
    border: none;
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 12px;
    cursor: pointer;
    color: #374151;
  }
  .status-banner {
    margin: 12px 16px 0;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.6;
  }
  .status-banner.pending { background: #fef3c7; color: #92400e; }
  .status-banner.rejected { background: #fee2e2; color: #991b1b; }

  .fab {
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 14px 20px;
    font-size: 14px;
    font-weight: 700;
    box-shadow: 0 4px 12px rgba(37,99,235,0.4);
    cursor: pointer;
    z-index: 20;
  }

  .content { padding: 16px; max-width: 700px; margin: 0 auto; padding-bottom: 90px; }

  .product-card {
    background: #fff;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .product-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 8px; }
  .product-name { font-size: 15px; font-weight: 700; }
  .product-meta { font-size: 12px; color: #9ca3af; margin-top: 3px; }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
  }
  .badge-pending { background: #fef3c7; color: #92400e; }
  .badge-approved { background: #dcfce7; color: #166534; }
  .badge-rejected { background: #fee2e2; color: #991b1b; }

  .product-images-row {
    display: flex;
    gap: 6px;
    margin: 8px 0;
    overflow-x: auto;
  }
  .product-images-row img {
    width: 60px;
    height: 60px;
    object-fit: cover;
    border-radius: 8px;
    flex-shrink: 0;
  }

  .pricing-list {
    margin-top: 10px;
    border-top: 1px solid #f3f4f6;
    padding-top: 10px;
  }
  .pricing-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    padding: 6px 0;
  }
  .pricing-vehicle { color: #374151; }
  .pricing-price { font-weight: 700; }

  .add-price-btn {
    width: 100%;
    margin-top: 10px;
    padding: 9px;
    background: #eff6ff;
    color: #1d4ed8;
    border: 1px dashed #93c5fd;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .empty-state { text-align: center; color: #9ca3af; padding: 60px 20px; font-size: 14px; }
  .loading { text-align: center; color: #9ca3af; padding: 30px; font-size: 14px; }

  /* ===== نموذج مودال ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 50;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.active { display: flex; }
  .modal-box {
    background: #fff;
    width: 100%;
    max-width: 480px;
    max-height: 88vh;
    overflow-y: auto;
    border-radius: 18px 18px 0 0;
    padding: 20px;
  }
  .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
  .modal-close {
    float: left;
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: #9ca3af;
  }
  .vehicle-result {
    padding: 10px;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    margin-bottom: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  .vehicle-result:hover { background: #f9fafb; }
  .vehicle-result.selected { background: #eff6ff; border-color: #2563eb; }
</style>
</head>
<body>

<!-- ===== شاشة الدخول ===== -->
<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <h1>🏬 دخول لوحة المورّد</h1>
    <label>اسم المستخدم</label>
    <input type="text" id="usernameInput" autocapitalize="none" />
    <label>كلمة المرور</label>
    <input type="password" id="passwordInput" />
    <button class="primary" id="loginBtn" onclick="login()">تسجيل الدخول</button>
    <div id="loginMsg" class="msg"></div>
  </div>
</div>

<!-- ===== لوحة التحكم ===== -->
<div id="dashboardScreen">
  <header>
    <div>
      <div class="title" id="supplierName"></div>
      <div class="sub">لوحة المورّد</div>
    </div>
    <button onclick="logout()">خروج</button>
  </header>

  <div id="statusBanner"></div>

  <div class="content">
    <div id="productsLoading" class="loading">جارٍ التحميل...</div>
    <div id="productsList"></div>
    <div id="productsEmpty" class="empty-state" style="display:none;">لا توجد منتجات بعد. اضغط + لإضافة أول منتج</div>
  </div>

  <button class="fab" onclick="openAddProductModal()">+ إضافة منتج</button>
</div>

<!-- ===== مودال إضافة منتج ===== -->
<div id="addProductModal" class="modal-overlay">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('addProductModal')">✕</button>
    <div class="modal-title">إضافة منتج جديد</div>

    <label>اسم المنتج</label>
    <input type="text" id="p_name" placeholder="طقم فحمات أمامية" />

    <label>الوصف (اختياري)</label>
    <textarea id="p_description" rows="3" placeholder="وصف مختصر للمنتج..."></textarea>

    <label>رقم القطعة (OEM) - اختياري</label>
    <input type="text" id="p_oem" placeholder="04465-XXXXX" />

    <label>الفئة (اختياري)</label>
    <input type="text" id="p_category" placeholder="فرامل، فلاتر، إلخ" />

    <label>الحالة</label>
    <select id="p_condition">
      <option value="new">جديد</option>
      <option value="used">مستعمل</option>
      <option value="refurbished">مجدّد</option>
    </select>

    <label>الكمية المتوفرة</label>
    <input type="number" id="p_stock" min="0" value="1" />

    <label>الصور (حتى 6 صور)</label>
    <input type="file" id="p_images" accept="image/*" multiple />

    <button class="primary" id="addProductBtn" onclick="submitAddProduct()">إضافة المنتج</button>
    <div id="addProductMsg" class="msg"></div>
  </div>
</div>

<!-- ===== مودال إضافة سعر لمركبة ===== -->
<div id="addPriceModal" class="modal-overlay">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('addPriceModal')">✕</button>
    <div class="modal-title">إضافة سعر لمركبة متوافقة</div>

    <label>ابحث عن المركبة</label>
    <input type="text" id="vehicleSearch" placeholder="مثال: Peugeot 407" oninput="searchVehicles()" />
    <div id="vehicleResults"></div>

    <div id="selectedVehicleDisplay" style="display:none; background:#eff6ff; border-radius:8px; padding:10px; margin-top:8px; font-size:13px; color:#1d4ed8; font-weight:600;"></div>

    <button type="button" class="add-price-btn" style="margin-top:10px;" onclick="toggleNewVehicleForm()">لم أجد المركبة؟ أضفها</button>

    <div id="newVehicleForm" style="display:none; background:#f9fafb; border:1px dashed #d1d5db; border-radius:10px; padding:14px; margin-top:10px;">
      <label>الماركة</label>
      <input type="text" id="nv_make" placeholder="Peugeot" />

      <label>الطراز / النوع الفرعي</label>
      <input type="text" id="nv_model" placeholder="407 2.0 HDI / 407 SW / 407 Coupé" />

      <div style="display:flex; gap:10px;">
        <div style="flex:1;">
          <label>سنة بداية الصنع</label>
          <input type="number" id="nv_year_start" placeholder="2004" />
        </div>
        <div style="flex:1;">
          <label>سنة نهاية الصنع</label>
          <input type="number" id="nv_year_end" placeholder="2011" />
        </div>
      </div>

      <label>نوع الهيكل (اختياري)</label>
      <input type="text" id="nv_body_type" placeholder="سيدان / SW / كوبيه" />

      <button type="button" class="primary" id="addVehicleBtn" onclick="submitNewVehicle()">إضافة المركبة واختيارها</button>
      <div id="newVehicleMsg" class="msg"></div>
    </div>

    <label style="margin-top:14px;">السعر (دج)</label>
    <input type="number" id="p_price" min="0" step="0.01" placeholder="0.00" />

    <button class="primary" id="addPriceBtn" onclick="submitAddPrice()">إضافة السعر</button>
    <div id="addPriceMsg" class="msg"></div>
  </div>
</div>

<script>
  const API_BASE = window.location.origin;
  let token = localStorage.getItem('user_token');
  let currentProductIdForPricing = null;
  let selectedVehicleId = null;
  let vehicleSearchTimeout = null;

  function showScreen() {
    if (token) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('dashboardScreen').style.display = 'block';
      loadProducts();
    } else {
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('dashboardScreen').style.display = 'none';
    }
  }

  function showMsg(elId, text, type) {
    const el = document.getElementById(elId);
    el.textContent = text;
    el.className = 'msg ' + type;
  }

  async function login() {
    const username = document.getElementById('usernameInput').value.trim();
    const password = document.getElementById('passwordInput').value;

    if (!username || !password) {
      showMsg('loginMsg', 'الرجاء إدخال اسم المستخدم وكلمة المرور', 'error');
      return;
    }

    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.textContent = 'جارٍ الدخول...';

    try {
      const res = await fetch(`${API_BASE}/api/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (data.success) {
        if (data.profile.role !== 'supplier') {
          showMsg('loginMsg', 'هذه اللوحة مخصصة للموردين فقط', 'error');
          return;
        }
        token = data.token;
        localStorage.setItem('user_token', token);
        localStorage.setItem('user_name', data.profile.full_name);
        localStorage.setItem('user_verification_status', data.profile.verification_status);
        showScreen();
      } else {
        showMsg('loginMsg', data.error || 'حدث خطأ', 'error');
      }
    } catch (err) {
      showMsg('loginMsg', 'خطأ في الاتصال: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'تسجيل الدخول';
    }
  }

  function logout() {
    localStorage.removeItem('user_token');
    localStorage.removeItem('user_name');
    localStorage.removeItem('user_verification_status');
    token = null;
    showScreen();
  }

  async function apiCall(path, options = {}) {
    const res = await fetch(`${API_BASE}${path}`, {
      ...options,
      headers: {
        'x-user-token': token,
        ...(options.headers || {})
      }
    });

    if (res.status === 401) {
      logout();
      return null;
    }
    return res.json();
  }

  function renderStatusBanner() {
    const status = localStorage.getItem('user_verification_status');
    const bannerEl = document.getElementById('statusBanner');

    if (status === 'pending') {
      bannerEl.innerHTML = `<div class="status-banner pending">⏳ حسابك قيد المراجعة. لن يظهر منتجك للمشترين حتى تتم الموافقة على وثائقك.</div>`;
    } else if (status === 'rejected') {
      bannerEl.innerHTML = `<div class="status-banner rejected">⚠️ لم تتم الموافقة على وثائقك. تواصل مع الدعم.</div>`;
    } else {
      bannerEl.innerHTML = '';
    }
  }

  async function loadProducts() {
    document.getElementById('supplierName').textContent = localStorage.getItem('user_name') || '';
    renderStatusBanner();

    document.getElementById('productsLoading').style.display = 'block';
    document.getElementById('productsList').innerHTML = '';
    document.getElementById('productsEmpty').style.display = 'none';

    const data = await apiCall('/api/supplier/products');
    document.getElementById('productsLoading').style.display = 'none';

    if (!data || !data.success) return;

    if (data.products.length === 0) {
      document.getElementById('productsEmpty').style.display = 'block';
      return;
    }

    const listEl = document.getElementById('productsList');
    data.products.forEach(p => {
      const card = document.createElement('div');
      card.className = 'product-card';

      const statusBadge = p.approval_status === 'approved' 
        ? '<span class="badge badge-approved">مقبول</span>'
        : p.approval_status === 'rejected'
        ? '<span class="badge badge-rejected">مرفوض</span>'
        : '<span class="badge badge-pending">قيد المراجعة</span>';

      const imagesHtml = p.images.map(url => `<img src="${url}" />`).join('');

      const pricingHtml = p.pricing.map(pr => {
        const pStatus = pr.approval_status === 'approved' ? '✅' : pr.approval_status === 'rejected' ? '❌' : '⏳';
        return `<div class="pricing-row">
          <span class="pricing-vehicle">${pStatus} ${escapeHtml(pr.make)} ${escapeHtml(pr.model)} (${pr.year_start}-${pr.year_end})</span>
          <span class="pricing-price">${pr.price} دج</span>
        </div>`;
      }).join('');

      card.innerHTML = `
        <div class="product-header">
          <div>
            <div class="product-name">${escapeHtml(p.name)}</div>
            <div class="product-meta">${escapeHtml(p.category || '')} · مخزون: ${p.stock_quantity}</div>
          </div>
          ${statusBadge}
        </div>
        <div class="product-images-row">${imagesHtml}</div>
        <div class="pricing-list">${pricingHtml || '<div style="color:#9ca3af;font-size:12px;">لا توجد أسعار مضافة بعد</div>'}</div>
        <button class="add-price-btn" onclick="openAddPriceModal(${p.id})">+ إضافة سعر لمركبة أخرى</button>
      `;
      listEl.appendChild(card);
    });
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text || '';
    return div.innerHTML;
  }

  function closeModal(id) {
    document.getElementById(id).classList.remove('active');
  }

  // ===== إضافة منتج =====

  function openAddProductModal() {
    document.getElementById('p_name').value = '';
    document.getElementById('p_description').value = '';
    document.getElementById('p_oem').value = '';
    document.getElementById('p_category').value = '';
    document.getElementById('p_condition').value = 'new';
    document.getElementById('p_stock').value = '1';
    document.getElementById('p_images').value = '';
    document.getElementById('addProductMsg').style.display = 'none';
    document.getElementById('addProductModal').classList.add('active');
  }

  async function submitAddProduct() {
    const name = document.getElementById('p_name').value.trim();
    const description = document.getElementById('p_description').value.trim();
    const oem = document.getElementById('p_oem').value.trim();
    const category = document.getElementById('p_category').value.trim();
    const condition = document.getElementById('p_condition').value;
    const stock = document.getElementById('p_stock').value;
    const images = document.getElementById('p_images').files;

    if (!name) {
      showMsg('addProductMsg', 'اسم المنتج مطلوب', 'error');
      return;
    }
    if (images.length === 0) {
      showMsg('addProductMsg', 'الرجاء رفع صورة واحدة على الأقل', 'error');
      return;
    }

    const btn = document.getElementById('addProductBtn');
    btn.disabled = true;
    btn.textContent = 'جارٍ الإضافة...';

    try {
      const formData = new FormData();
      formData.append('name', name);
      formData.append('description', description);
      formData.append('oem_number', oem);
      formData.append('category', category);
      formData.append('condition', condition);
      formData.append('stock_quantity', stock);
      for (let i = 0; i < images.length; i++) {
        formData.append('images', images[i]);
      }

      const res = await fetch(`${API_BASE}/api/supplier/products`, {
        method: 'POST',
        headers: { 'x-user-token': token },
        body: formData
      });
      const data = await res.json();

      if (data.success) {
        closeModal('addProductModal');
        loadProducts();
      } else {
        showMsg('addProductMsg', data.error || 'حدث خطأ', 'error');
      }
    } catch (err) {
      showMsg('addProductMsg', 'خطأ في الاتصال: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'إضافة المنتج';
    }
  }

  // ===== إضافة سعر لمركبة =====

  function openAddPriceModal(productId) {
    currentProductIdForPricing = productId;
    selectedVehicleId = null;
    document.getElementById('vehicleSearch').value = '';
    document.getElementById('vehicleResults').innerHTML = '';
    document.getElementById('selectedVehicleDisplay').style.display = 'none';
    document.getElementById('newVehicleForm').style.display = 'none';
    document.getElementById('nv_make').value = '';
    document.getElementById('nv_model').value = '';
    document.getElementById('nv_year_start').value = '';
    document.getElementById('nv_year_end').value = '';
    document.getElementById('nv_body_type').value = '';
    document.getElementById('p_price').value = '';
    document.getElementById('addPriceMsg').style.display = 'none';
    document.getElementById('addPriceModal').classList.add('active');
  }

  function toggleNewVehicleForm() {
    const formEl = document.getElementById('newVehicleForm');
    formEl.style.display = formEl.style.display === 'none' ? 'block' : 'none';
  }

  function selectVehicle(id, label) {
    selectedVehicleId = id;
    const displayEl = document.getElementById('selectedVehicleDisplay');
    displayEl.style.display = 'block';
    displayEl.textContent = '✓ المركبة المختارة: ' + label;
    document.getElementById('newVehicleForm').style.display = 'none';
  }

  async function submitNewVehicle() {
    const make = document.getElementById('nv_make').value.trim();
    const model = document.getElementById('nv_model').value.trim();
    const yearStart = document.getElementById('nv_year_start').value;
    const yearEnd = document.getElementById('nv_year_end').value;
    const bodyType = document.getElementById('nv_body_type').value.trim();

    if (!make || !model || !yearStart || !yearEnd) {
      showMsg('newVehicleMsg', 'الماركة، الطراز، وسنوات الصنع مطلوبة', 'error');
      return;
    }

    const btn = document.getElementById('addVehicleBtn');
    btn.disabled = true;
    btn.textContent = 'جارٍ الإضافة...';

    try {
      const res = await fetch(`${API_BASE}/api/vehicles`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-user-token': token },
        body: JSON.stringify({
          make, model,
          year_start: yearStart, year_end: yearEnd,
          body_type: bodyType || null
        })
      });
      const data = await res.json();

      if (data.success) {
        const v = data.vehicle;
        selectVehicle(v.id, `${v.make} ${v.model} (${v.year_start}-${v.year_end})`);
        document.getElementById('vehicleSearch').value = '';
        document.getElementById('vehicleResults').innerHTML = '';
      } else {
        showMsg('newVehicleMsg', data.error || 'حدث خطأ', 'error');
      }
    } catch (err) {
      showMsg('newVehicleMsg', 'خطأ في الاتصال: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'إضافة المركبة واختيارها';
    }
  }

  function searchVehicles() {
    clearTimeout(vehicleSearchTimeout);
    const query = document.getElementById('vehicleSearch').value.trim();

    vehicleSearchTimeout = setTimeout(async () => {
      const url = query 
        ? `${API_BASE}/api/vehicles?search=${encodeURIComponent(query)}`
        : `${API_BASE}/api/vehicles`;
      const res = await fetch(url);
      const data = await res.json();

      const resultsEl = document.getElementById('vehicleResults');
      resultsEl.innerHTML = '';

      if (data.success && data.vehicles.length > 0) {
        data.vehicles.forEach(v => {
          const div = document.createElement('div');
          div.className = 'vehicle-result';
          const label = `${v.make} ${v.model} (${v.year_start}-${v.year_end})`;
          div.textContent = label;
          div.onclick = () => {
            document.querySelectorAll('.vehicle-result').forEach(el => el.classList.remove('selected'));
            div.classList.add('selected');
            selectVehicle(v.id, label);
          };
          resultsEl.appendChild(div);
        });
      } else {
        resultsEl.innerHTML = '<div style="color:#9ca3af;font-size:13px;padding:8px;">لا توجد نتائج</div>';
      }
    }, 400);
  }

  async function submitAddPrice() {
    const price = document.getElementById('p_price').value;

    if (!selectedVehicleId) {
      showMsg('addPriceMsg', 'الرجاء اختيار مركبة من نتائج البحث', 'error');
      return;
    }
    if (!price || parseFloat(price) <= 0) {
      showMsg('addPriceMsg', 'الرجاء إدخال سعر صحيح', 'error');
      return;
    }

    const btn = document.getElementById('addPriceBtn');
    btn.disabled = true;
    btn.textContent = 'جارٍ الإضافة...';

    const data = await apiCall(`/api/supplier/products/${currentProductIdForPricing}/pricing`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ vehicle_id: selectedVehicleId, price: parseFloat(price) })
    });

    btn.disabled = false;
    btn.textContent = 'إضافة السعر';

    if (data && data.success) {
      closeModal('addPriceModal');
      loadProducts();
    } else {
      showMsg('addPriceMsg', data?.error || 'حدث خطأ', 'error');
    }
  }

  showScreen();
</script>

</body>
</html>
