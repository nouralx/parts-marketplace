<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول / Connexion</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #f3f4f6;
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    background: #fff;
    width: 100%;
    max-width: 420px;
    margin: 20px;
    border-radius: 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    padding: 30px 24px;
  }
  .lang-switch {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-bottom: 16px;
  }
  .lang-switch button {
    border: 1px solid #ddd;
    background: #fff;
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 13px;
    color: #555;
  }
  .lang-switch button.active {
    background: #2563eb;
    color: #fff;
    border-color: #2563eb;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 20px;
    text-align: center;
    color: #1f2937;
  }
  label {
    display: block;
    font-size: 14px;
    margin-bottom: 6px;
    color: #374151;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 15px;
    margin-bottom: 8px;
    outline: none;
  }
  input:focus {
    border-color: #2563eb;
  }
  .forgot-link {
    text-align: left;
    margin-bottom: 16px;
    font-size: 13px;
  }
  .forgot-link a {
    color: #2563eb;
    text-decoration: none;
    cursor: pointer;
  }
  button.primary {
    width: 100%;
    padding: 13px;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
    font-weight: 600;
  }
  button.primary:disabled {
    background: #93c5fd;
    cursor: not-allowed;
  }
  button.primary:hover:not(:disabled) {
    background: #1d4ed8;
  }
  .msg {
    margin-top: 14px;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
    display: none;
  }
  .msg.success {
    background: #dcfce7;
    color: #166534;
    display: block;
  }
  .msg.error {
    background: #fee2e2;
    color: #991b1b;
    display: block;
  }
  .step {
    display: none;
  }
  .step.active {
    display: block;
  }
  .success-icon {
    text-align: center;
    font-size: 48px;
    margin-bottom: 12px;
  }
  .register-link {
    text-align: center;
    margin-top: 16px;
    font-size: 13px;
    color: #6b7280;
  }
  .register-link a {
    color: #2563eb;
    text-decoration: none;
    font-weight: 600;
  }
  .role-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    margin-top: 8px;
  }
  .role-badge.role-buyer {
    background: #eff6ff;
    color: #1d4ed8;
  }
  .role-badge.role-supplier {
    background: #eff6ff;
    color: #1d4ed8;
  }
  .status-banner {
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 13px;
    text-align: right;
    line-height: 1.7;
    display: none;
  }
  .status-banner.pending {
    background: #fef3c7;
    color: #92400e;
    display: block;
  }
  .status-banner.rejected {
    background: #fee2e2;
    color: #991b1b;
    display: block;
  }
  .status-icon {
    font-size: 18px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="lang-switch">
    <button id="btn-ar" class="active" onclick="setLang('ar')">العربية</button>
    <button id="btn-fr" onclick="setLang('fr')">Français</button>
  </div>

  <h1 data-i18n="title">تسجيل الدخول</h1>

  <!-- خطوة الدخول -->
  <div id="step1" class="step active">
    <label data-i18n="usernameLabel">اسم المستخدم</label>
    <input type="text" id="usernameInput" placeholder="mohamed_ahmed" autocapitalize="none" />

    <label data-i18n="passwordLabel">كلمة المرور</label>
    <input type="password" id="passwordInput" placeholder="••••••••" />

    <div class="forgot-link">
      <a href="forgot-password.html" data-i18n="forgotLink">نسيت كلمة المرور؟</a>
    </div>

    <button class="primary" id="loginBtn" onclick="login()">
      <span data-i18n="loginBtn">تسجيل الدخول</span>
    </button>
    <div id="msg1" class="msg"></div>

    <div class="register-link">
      <span data-i18n="noAccountText">ليس لديك حساب؟</span>
      <a href="register.html" data-i18n="registerLink">أنشئ حساباً</a>
    </div>
  </div>

  <!-- خطوة النجاح -->
  <div id="step2" class="step">
    <div class="success-icon">✅</div>
    <h1 id="welcomeTitle">مرحباً بعودتك</h1>
    <div id="roleBadge" class="role-badge" style="display:block;text-align:center;margin-left:auto;margin-right:auto;width:fit-content;"></div>

    <div id="statusBanner" class="status-banner">
      <span class="status-icon" id="statusIcon"></span>
      <span id="statusText"></span>
    </div>
  </div>
</div>

<script>
  const API_BASE = window.location.origin;
  let currentLang = 'ar';

  const translations = {
    ar: {
      title: 'تسجيل الدخول',
      usernameLabel: 'اسم المستخدم',
      passwordLabel: 'كلمة المرور',
      forgotLink: 'نسيت كلمة المرور؟',
      loginBtn: 'تسجيل الدخول',
      noAccountText: 'ليس لديك حساب؟',
      registerLink: 'أنشئ حساباً',
      loggingIn: 'جارٍ الدخول...',
      errFields: 'الرجاء إدخال اسم المستخدم وكلمة المرور',
      welcomeBack: 'مرحباً بعودتك',
      roleBuyer: 'حساب مشترٍ',
      roleSupplier: 'حساب مورّد',
      pendingStatus: 'حسابك قيد المراجعة حالياً. لن تتمكن من عرض منتجاتك أو استخدام كامل ميزات المورّد حتى تتم الموافقة على وثائقك من قِبل الإدارة.',
      rejectedStatus: 'للأسف، لم تتم الموافقة على وثائقك. الرجاء التواصل مع الدعم لمعرفة التفاصيل وإعادة رفع الوثائق الصحيحة.'
    },
    fr: {
      title: 'Connexion',
      usernameLabel: "Nom d'utilisateur",
      passwordLabel: 'Mot de passe',
      forgotLink: 'Mot de passe oublié ?',
      loginBtn: 'Se connecter',
      noAccountText: "Vous n'avez pas de compte ?",
      registerLink: 'Créer un compte',
      loggingIn: 'Connexion en cours...',
      errFields: "Veuillez entrer votre nom d'utilisateur et mot de passe",
      welcomeBack: 'Bon retour',
      roleBuyer: 'Compte Acheteur',
      roleSupplier: 'Compte Fournisseur',
      pendingStatus: "Votre compte est actuellement en cours de vérification. Vous ne pourrez pas afficher vos produits ni utiliser toutes les fonctionnalités fournisseur tant que vos documents n'auront pas été approuvés.",
      rejectedStatus: "Malheureusement, vos documents n'ont pas été approuvés. Veuillez contacter le support pour plus de détails et soumettre à nouveau les documents corrects."
    }
  };

  function setLang(lang) {
    currentLang = lang;
    document.getElementById('btn-ar').classList.toggle('active', lang === 'ar');
    document.getElementById('btn-fr').classList.toggle('active', lang === 'fr');
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (translations[lang][key]) {
        el.textContent = translations[lang][key];
      }
    });
  }

  function t(key) {
    return translations[currentLang][key];
  }

  function showMsg(elId, text, type) {
    const el = document.getElementById(elId);
    el.textContent = text;
    el.className = 'msg ' + type;
  }

  async function login() {
    const username = document.getElementById('usernameInput').value.trim();
    const password = document.getElementById('passwordInput').value;

    if (!username || !password) {
      showMsg('msg1', t('errFields'), 'error');
      return;
    }

    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.textContent = t('loggingIn');

    try {
      const res = await fetch(`${API_BASE}/api/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (data.success) {
        const profile = data.profile;
        document.getElementById('welcomeTitle').textContent = `${t('welcomeBack')}، ${profile.full_name}`;

        const badgeEl = document.getElementById('roleBadge');
        badgeEl.textContent = profile.role === 'buyer' ? t('roleBuyer') : t('roleSupplier');
        badgeEl.className = 'role-badge role-' + profile.role;

        const bannerEl = document.getElementById('statusBanner');
        const iconEl = document.getElementById('statusIcon');
        const textEl = document.getElementById('statusText');

        if (profile.role === 'supplier' && profile.verification_status === 'pending') {
          bannerEl.className = 'status-banner pending';
          iconEl.textContent = '⏳';
          textEl.textContent = t('pendingStatus');
        } else if (profile.role === 'supplier' && profile.verification_status === 'rejected') {
          bannerEl.className = 'status-banner rejected';
          iconEl.textContent = '⚠️';
          textEl.textContent = t('rejectedStatus');
        } else {
          bannerEl.className = 'status-banner';
        }

        document.getElementById('step1').classList.remove('active');
        document.getElementById('step2').classList.add('active');

        // حفظ الجلسة: نفس الاسم "user_token" مستعمل في كل صفحات الموقع (catalog.html, product.html...)
        localStorage.setItem('user_token', data.token);
        localStorage.setItem('user_profile', JSON.stringify(profile));

        // إعادة التوجيه: إما لصفحة "redirect" المطلوبة، أو للوجهة الافتراضية حسب نوع الحساب
        const redirectTo = new URLSearchParams(window.location.search).get('redirect');
        setTimeout(() => {
          if (redirectTo) {
            window.location.href = redirectTo;
          } else if (profile.role === 'supplier') {
            window.location.href = '/supplier-dashboard.html';
          } else if (profile.role === 'admin' || profile.role === 'staff') {
            window.location.href = '/admin-dashboard.html';
          } else {
            window.location.href = '/catalog.html';
          }
        }, 900);
      } else {
        showMsg('msg1', data.error || 'Error', 'error');
      }
    } catch (err) {
      showMsg('msg1', 'Network error: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = `<span data-i18n="loginBtn">${t('loginBtn')}</span>`;
    }
  }

  setLang('ar');
</script>

</body>
</html>
